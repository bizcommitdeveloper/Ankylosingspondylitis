# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
#
# App Hosting builds this Next.js app with Cloud Build and serves it on
# Cloud Run, so server-side rendering works out of the box. It requires the
# Blaze (pay-as-you-go) billing plan. App Hosting is framework-aware and runs
# `next build` automatically — do not add `output: 'export'` to next.config.

runConfig:
  # Scale to zero when idle to keep costs near-zero; raise maxInstances as
  # traffic grows.
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Firebase Web SDK configuration.
#
# These NEXT_PUBLIC_* values are public: they ship in the browser bundle and
# are guarded by Firestore security rules, not by secrecy. Next.js inlines them
# at build time, so they must be available during BUILD (not just RUNTIME).
#
# Replace each placeholder with your project's value from:
#   Firebase console → Project settings → General → Your apps → SDK setup.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: your-api-key
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: your-project.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: your-project-id
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: your-project.appspot.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: your-messaging-sender-id
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: your-app-id
    availability:
      - BUILD
      - RUNTIME
